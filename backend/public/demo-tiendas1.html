<!DOCTYPE HTML>
<html lang="es">

<head>
    <title>Sakura Sushi | Menú Digital IA</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-body: #080808;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0ece4;
            --text-muted: #6b6b6b;
            --accent: #c8a96e;
            --accent-rgb: 200, 169, 110;
            --nav-bg: rgba(8, 8, 8, 0.75);
            --hero-overlay: rgba(0, 0, 0, 0.65);
        }

        body.theme-azul {
            --bg-body: #060d18;
            --accent: #5eb8ff;
            --accent-rgb: 94, 184, 255;
            --text-main: #e8f4ff;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-border: rgba(94, 184, 255, 0.1);
        }

        body.theme-neon-claro {
            --bg-body: #f7f5f0;
            --accent: #2d6a4f;
            --accent-rgb: 45, 106, 79;
            --text-main: #1a1a1a;
            --text-muted: #7a7a7a;
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-card-border: rgba(45, 106, 79, 0.12);
            --nav-bg: rgba(247, 245, 240, 0.85);
            --hero-overlay: rgba(0, 0, 0, 0.4);
        }

        body.theme-pastel {
            --bg-body: #fdf6f0;
            --accent: #c0603c;
            --accent-rgb: 192, 96, 60;
            --text-main: #2a1f1a;
            --text-muted: #8a7a74;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-border: rgba(192, 96, 60, 0.1);
            --nav-bg: rgba(253, 246, 240, 0.85);
            --hero-overlay: rgba(0, 0, 0, 0.35);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.6s, color 0.6s;
            overflow-x: hidden;
        }

        /* ===== NAV ===== */
        .sushi-nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            z-index: 1000;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(128, 128, 128, 0.08);
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            letter-spacing: 4px;
            font-size: 1.1rem;
            text-decoration: none;
            color: inherit;
            text-transform: uppercase;
        }

        .logo span { color: var(--accent); }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-cart {
            position: relative;
            background: transparent;
            border: 1px solid var(--bg-card-border);
            color: var(--text-main);
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--bg-card-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .back-link:hover { color: var(--accent); }

        /* ===== HERO ===== */
        .sushi-hero {
            height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?w=1200&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .overlay-dark { position: absolute; inset: 0; background: var(--hero-overlay); z-index: 1; }

        .hero-content { position: relative; z-index: 3; text-align: center; }

        .hero-content h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 10vw, 6rem);
            font-style: italic;
            font-weight: 300;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .hero-content h1 em { font-style: normal; font-weight: 600; color: var(--accent); }

        /* ===== MENU & GRID ===== */
        .filters-bar {
            position: sticky;
            top: 72px;
            z-index: 100;
            background: var(--bg-body);
            border-bottom: 1px solid var(--bg-card-border);
            padding: 0 5%;
        }

        .filters-inner { display: flex; overflow-x: auto; max-width: 1200px; margin: auto; scrollbar-width: none; }
        .filters-inner::-webkit-scrollbar { display: none; }

        .filter-tab {
            padding: 18px 20px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-tab.active { color: var(--text-main); border-bottom: 2px solid var(--accent); }

        .menu-container { padding: 60px 5%; max-width: 1200px; margin: auto; }

        .grid-sushi {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 20px;
            overflow: hidden;
            transition: 0.4s ease;
        }

        .product-card:hover { transform: translateY(-5px); border-color: var(--accent); }

        .card-img-wrap img { width: 100%; height: 220px; object-fit: cover; }

        .product-info { padding: 20px; }
        .product-info h4 { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; margin-bottom: 8px; }
        .product-info p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

        .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; }
        .price { font-weight: 600; color: var(--accent); font-size: 1.2rem; }

        .btn-add {
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--accent);
            background: transparent; color: var(--accent); font-size: 0.7rem; font-weight: 600;
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }

        .btn-add:hover { background: var(--accent); color: #000; }

        /* ===== MODAL ===== */
        .sushi-modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px);
            z-index: 9999; align-items: center; justify-content: center;
        }

        .modal-content {
            background: #000; padding: 40px; border-radius: 25px;
            width: 90%; max-width: 400px; text-align: center;
            border: 1px solid var(--accent);
        }

        /* =========================================
           RESPONSIVE - AJUSTES FINALES
           ========================================= */
        @media (min-width: 1600px) {
            .menu-container, .filters-inner { max-width: 1400px; }
            .grid-sushi { grid-template-columns: repeat(4, 1fr); }
        }

        @media (max-width: 768px) {
            .sushi-nav { padding: 0 15px; height: 64px; }
            .grid-sushi { grid-template-columns: 1fr; } /* 1 Columna en móvil */
            .back-link { font-size: 0.65rem; }
            .hero-content h1 { font-size: 3.5rem; }
            .highlight-card { grid-template-columns: 1fr !important; }
        }
    </style>
</head>

<body>
    <header class="sushi-nav">
        <a href="#" class="logo">SAKURA <span>SUSHI</span></a>
        <div class="nav-controls">
            <button class="nav-cart"><i class="fas fa-bag-shopping"></i></button>
            <!-- BOTÓN VOLVER INTELIGENTE -->
            <a href="javascript:history.back()" class="back-link">← Volver</a>
        </div>
    </header>

    <main class="sushi-hero">
        <div class="overlay-dark"></div>
        <div class="hero-content">
            <h1>El arte<br>de lo <em>fresco</em></h1>
        </div>
    </main>

    <div class="filters-bar">
        <div class="filters-inner">
            <button class="filter-tab active" onclick="setFilter(this,'todo')">Todo</button>
            <button class="filter-tab" onclick="setFilter(this,'rolls')">Rolls</button>
            <button class="filter-tab" onclick="setFilter(this,'nigiri')">Nigiri</button>
            <button class="filter-tab" onclick="setFilter(this,'sashimi')">Sashimi</button>
        </div>
    </div>

    <section class="menu-container">
        <div class="grid-sushi" id="contenedor-productos"></div>
    </section>

    <div id="modal-lead" class="sushi-modal">
        <div class="modal-content" id="modal-inner">
            <h3 style="margin-bottom: 20px; font-family: 'Cormorant Garamond', serif; font-size: 2rem;">Confirmar pedido</h3>
            <span id="modal-product-label" style="color: var(--accent); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px;">—</span>
            <input type="tel" id="user-phone" placeholder="Tu WhatsApp" style="width: 100%; margin: 25px 0; padding: 15px; background: #111; border: 1px solid #333; color: white; border-radius: 10px; text-align: center;">
            <button class="btn-add" style="width: 100%; padding: 15px;" onclick="enviarWhatsApp()">Enviar pedido</button>
            <button onclick="closeModal()" style="background: none; border: none; color: gray; margin-top: 20px; text-decoration: underline; cursor: pointer;">Cancelar</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxoNcX2uxRv8kvjYS8JwNQU2BT7vM8WCDTdgw_nYQtNYTm5kL5OmPp4cveTuQqIge3_/exec";
        let productoSeleccionado = "";

        const sushiItems = [
            { n: "Omakase Premium", d: "Selección del chef, 24 cortes", img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=600&q=80", cat: "rolls" },
            { n: "Spicy Tuna Roll", d: "Atún rojo, sriracha y cebollín", img: "https://images.unsplash.com/photo-1625938144755-652e08e359b7?w=600&q=80", cat: "rolls" },
            { n: "Sake Nigiri", d: "Corte magro de salmón fresco", img: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?w=600&q=80", cat: "nigiri" },
            { n: "Sashimi Mix", d: "Cortes frescos del día (12 pcs)", img: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=600&q=80", cat: "sashimi" }
        ];

        function cargarProductos(filtro = 'todo') {
            const lista = filtro === 'todo' ? sushiItems : sushiItems.filter(i => i.cat === filtro);
            let html = '';
            lista.forEach((item, i) => {
                html += `
                <div class="product-card">
                    <div class="card-img-wrap"><img src="${item.img}"></div>
                    <div class="product-info">
                        <h4>${item.n}</h4>
                        <p>${item.d}</p>
                        <div class="card-footer">
                            <span class="price">$8.900</span>
                            <button class="btn-add" onclick="abrirCaptura('${item.n}')">Pedir</button>
                        </div>
                    </div>
                </div>`;
            });
            $('#contenedor-productos').html(html);
        }

        function setFilter(el, cat) {
            $('.filter-tab').removeClass('active'); $(el).addClass('active');
            cargarProductos(cat);
        }

        function abrirCaptura(nombre) {
            productoSeleccionado = nombre;
            $('#modal-product-label').text(nombre);
            $('#modal-lead').css('display', 'flex');
        }

        function closeModal() { $('#modal-lead').hide(); }

        function enviarWhatsApp() {
            const phone = $('#user-phone').val().trim();
            if (phone.length < 8) return alert("WhatsApp inválido");
            
            fetch(WEBHOOK_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ telefono: phone, producto: productoSeleccionado, origen: "Demo Sushi" }) 
            }).then(() => {
                $('#modal-inner').html('<h3>¡Pedido enviado!</h3><p style="margin-top:20px;">IAsesoria hace esto posible para tu local.</p><button class="btn-add" style="margin-top:20px; width:100%;" onclick="location.reload()">Aceptar</button>');
            });
        }

        $(document).ready(() => cargarProductos());
    </script>
</body>
</html>
